name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'HABAI182/live2d-desktop-pet-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Check released source belongs to main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_package.py
      - name: Build and verify tracked skill package
        run: python tools/build_release.py --expected-tag "$RELEASE_TAG"
      - name: Upload new draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.skill dist/SHA256-*.json
          --repo "$GITHUB_REPOSITORY" --verify-tag --draft
          --title "$RELEASE_TAG · Live2D Desktop Pet Skill"
          --notes-file dist/RELEASE-NOTES.md
      - name: Download and verify uploaded bytes before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir readback
          python tools/build_release.py --verify-dir readback --expected-tag "$RELEASE_TAG"
      - name: Publish verified release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
